name: track

on:
  schedule:
    # 每 12 小時：UTC 23:50 與 11:50（台北時間 07:50、19:50）。
    #
    # 時間刻意挑非整點、且避開 UTC 午夜：`0 0 * * *` 是 GitHub Actions 最壅塞的
    # 排程格，官方也明講 schedule 在高負載時會延遲、每小時開頭最嚴重。
    # 這個 repo 用 `0 0 * * *` 的那兩週，實際開跑時間穩定落在 +7～13 小時
    # （名目 UTC 00:00，實際都在 09:00-12:40 UTC），沒有一次接近準時。
    # 挪到冷門時段後延遲通常只剩幾分鐘，名目時間才約等於實際時間。
    - cron: "50 23,11 * * *"
  workflow_dispatch:

# 讓 GITHUB_TOKEN 能把抓取結果 commit 回 repo。
permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: 安裝依賴
        run: pip install -r collector/requirements.txt

      - name: 抓取並比對
        run: python collector/main.py

      - name: 有變更就 commit & push
        run: |
          if [ -z "$(git status --porcelain data docs/data)" ]; then
            echo "資料沒有變化，不 commit。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git commit -m "chore: 更新價格資料 $(date -u +%Y-%m-%d)"
          # 排程重疊時遠端可能已有新 commit，先 rebase 再推。
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

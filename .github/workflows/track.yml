name: track

on:
  schedule:
    # 每 12 小時：UTC 00:00 與 12:00（台北時間 08:00、20:00）。
    # GitHub 排程尖峰時可能延遲數十分鐘，屬正常。
    - cron: "0 0,12 * * *"
  workflow_dispatch:

# 讓 GITHUB_TOKEN 能把抓取結果 commit 回 repo。
permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: 安裝依賴
        run: pip install -r collector/requirements.txt

      - name: 抓取並比對
        run: python collector/main.py

      - name: 有變更就 commit & push
        run: |
          if [ -z "$(git status --porcelain data docs/data)" ]; then
            echo "資料沒有變化，不 commit。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git commit -m "chore: 更新價格資料 $(date -u +%Y-%m-%d)"
          # 排程重疊時遠端可能已有新 commit，先 rebase 再推。
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: track

on:
  schedule:
    # 約每 12 小時：UTC 01:17 與 13:22（台北時間 09:17、21:22）。
    #
    # 刻意挑非整點的分鐘：整點是 GitHub Actions 的壅塞時段（官方明講 schedule
    # 在高負載時會延遲、每小時開頭最嚴重）。實測本 repo 用整點排程時，UTC 00:00
    # 那格穩定延遲 +7～13 小時（中位數 9.4h），UTC 12:00 那格 3.7～6.2 小時且在
    # 惡化 —— 光是換小時就差一倍，可見午夜最壞。挪分鐘是更大的槓桿，:15/:30/:45
    # 同樣熱門，所以取 :17 和 :22。
    #
    # 兩格分鐘不同，沒辦法併成一行的 "17 1,13"，只能寫兩條。
    - cron: "17 1 * * *"
    - cron: "22 13 * * *"
  workflow_dispatch:

# 讓 GITHUB_TOKEN 能把抓取結果 commit 回 repo。
permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: 安裝依賴
        run: pip install -r collector/requirements.txt

      - name: 抓取並比對
        run: python collector/main.py

      - name: 有變更就 commit & push
        run: |
          if [ -z "$(git status --porcelain data docs/data)" ]; then
            echo "資料沒有變化，不 commit。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git commit -m "chore: 更新價格資料 $(date -u +%Y-%m-%d)"
          # 排程重疊時遠端可能已有新 commit，先 rebase 再推。
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

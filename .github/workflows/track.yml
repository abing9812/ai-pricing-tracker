name: track

on:
  schedule:
    # 每 12 小時：UTC 00:00 與 12:00（台北時間 08:00、20:00）。
    #
    # 這兩格是 GitHub Actions 的壅塞時段（官方明講 schedule 在高負載時會延遲、
    # 每小時開頭最嚴重），實測本 repo 的 00:00 排程穩定延遲 +7～13 小時，
    # 中位數約 9.5 小時。已知且可接受：這是價格追蹤，早幾小時晚幾小時不影響判讀。
    # 若哪天需要準時，把分鐘挪離整點、避開 UTC 午夜即可（例如 "50 23,11 * * *"）。
    - cron: "0 0,12 * * *"
  workflow_dispatch:

# 讓 GITHUB_TOKEN 能把抓取結果 commit 回 repo。
permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: 安裝依賴
        run: pip install -r collector/requirements.txt

      - name: 抓取並比對
        run: python collector/main.py

      - name: 有變更就 commit & push
        run: |
          if [ -z "$(git status --porcelain data docs/data)" ]; then
            echo "資料沒有變化，不 commit。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git commit -m "chore: 更新價格資料 $(date -u +%Y-%m-%d)"
          # 排程重疊時遠端可能已有新 commit，先 rebase 再推。
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
